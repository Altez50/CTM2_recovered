name: CTM quality gate

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: current/api/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: current/web-client/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r current/api/requirements-dev.txt
      - name: Install frontend dependencies
        run: npm ci
        working-directory: current/web-client
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: current/web-client
      - name: Run quality gate
        run: python verify.py
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            current/web-client/playwright-report/
            current/web-client/test-results/
